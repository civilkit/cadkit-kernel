[package]
name = "ck-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ck-json = { path = "../ck-json" }
ck-server = { path = "../ck-server" }
ck-model = { path = "../ck-model" }
ck-core = { path = "../ck-core" }
ck-geom = { path = "../ck-geom" }
ck-topo = { path = "../ck-topo" }
ck-check = { path = "../ck-check" }
ck-heal = { path = "../ck-heal" }
ck-ops = { path = "../ck-ops" }
ck-io = { path = "../ck-io" }
ck-sldprt = { path = "../ck-sldprt" }
ck-swedit = { path = "../ck-swedit" }
ck-skp = { path = "../ck-skp", optional = true }
ck-tess = { path = "../ck-tess" }
ck-recog = { path = "../ck-recog" }
ck-text = { path = "../ck-text" }

[features]
# SketchUp (.skp) import (`importSkp`), +320 KB of wasm (+4.6 %): on by default, see docs/skp.md
default = ["skp"]
skp = ["dep:ck-skp"]
sanity-shadow = ["ck-ops/sanity-shadow"]
